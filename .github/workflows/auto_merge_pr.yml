name: Auto-merge ready PRs

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes
  workflow_dispatch: {}

permissions:
  pull-requests: write
  contents: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PRs when ready
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: prs } = await github.pulls.list({ owner, repo, state: 'open' });

            for (const pr of prs) {
              try {
                if (pr.draft) continue;

                // require the `needs-review` label to opt-in
                const labels = pr.labels.map(l => l.name.toLowerCase());
                if (!labels.includes('needs-review')) continue;

                // refresh PR to get mergeable status
                const { data: prFull } = await github.pulls.get({ owner, repo, pull_number: pr.number });
                // check combined status (legacy) for CI
                const status = await github.repos.getCombinedStatusForRef({ owner, repo, ref: pr.head.sha });
                if (status.data.state !== 'success') continue;

                // require at least one approval from someone other than the author
                const { data: reviews } = await github.pulls.listReviews({ owner, repo, pull_number: pr.number });
                const approved = reviews.some(r => r.state === 'APPROVED' && r.user && r.user.login !== pr.user.login);
                if (!approved) continue;

                // ensure mergeable state is clean or has no conflicts
                if (prFull.mergeable === false) continue;

                // Merge (squash) the PR
                await github.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
                core.info(`Merged PR #${pr.number} (${pr.title})`);
              } catch (e) {
                core.warning(`Skipping PR #${pr.number}: ${e.message}`);
              }
            }